services:
  backend:
    container_name: weather-backend
    image: weather-backend
    build:
      context: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      PORT: 8000
    expose:
      - "8000"
    networks:
      - weather-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  frontend:
    container_name: weather-frontend
    image: weather-frontend
    build:
      context: .
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    networks:
      - weather-net
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  weather-net:
    name: weather-net
    driver: bridge
